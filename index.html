<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12081f">
<title>PureGPT</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">✦</div><div><b>PureGPT</b><small>AI Assistant</small></div></div>
    <button id="newChat" class="new-chat">＋ New Chat</button>
    <div class="label">RECENT CHATS</div>
    <div id="history"></div>
  </aside>
  <main class="main">
    <header><button class="icon menu" id="menu">☰</button><div class="title"><div class="mini">✦</div><div><b>PureGPT</b><small><i></i> AI Online</small></div></div><button class="icon" id="clear">⌫</button></header>
    <section id="chat" class="chat">
      <div id="welcome" class="welcome"><div class="hero">✦</div><h1>How can I help you today?</h1><p>Ask anything. PureGPT is ready to help.</p><div class="suggestions"><button>Explain a difficult topic</button><button>Help me write something</button><button>Help me with coding</button><button>Give me creative ideas</button></div></div>
      <div id="messages"></div>
    </section>
    <footer><div class="input"><textarea id="input" rows="1" placeholder="Message PureGPT..."></textarea><button id="send">↑</button></div><small>PureGPT can make mistakes. Verify important information.</small></footer>
  </main>
</div>
<script src="script.js"></script>
</body>
</html>
